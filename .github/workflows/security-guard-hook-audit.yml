name: Security Guard Hook Audit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'

timeout-minutes: 15
permissions:
  contents: read

jobs:
  hook-audit:
    uses: KooshaPari/phenoShared/.github/workflows/security-guard-hook-audit-reusable.yml@ac1fef63f31acb3ec550bfdc1f1915075dd1fbb9 # pinned
