name: Security Guard Hook Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hook-audit:
    name: Pre-commit Hook Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@f677139bbe7f9c59b41fb27a11e0a213e7ea46f3 # v5.2.0
        with:
          python-version: '3.11'
      - name: Install pre-commit
        run: |
          pip install pre-commit
      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files || true
      - name: Check for .pre-commit-config.yaml
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "::warning::No .pre-commit-config.yaml found"
          fi
