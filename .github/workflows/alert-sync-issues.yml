name: Alert Sync Issues

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
timeout-minutes: 10

permissions:
  contents: read
  issues: write
  security-events: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  alert-sync:
    uses: KooshaPari/phenoShared/.github/workflows/alert-sync-issues-reusable.yml@438e2e71e448c9f1f47f184d3ca4acbb28928677
    with:
      auto-label: auto-alert-sync

