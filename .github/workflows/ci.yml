name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d632683dd7b4114ad1992be3c231f06b3cb7b4de # v6.0.2
      - uses: actions/setup-node@1f8c5b94ccc75b605ac60e387ee280e8b74667f8 # v4
        with:
          node-version: '20'
      - run: npm install -g bun && cd ./typescript/packages/conft && bun install && bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d632683dd7b4114ad1992be3c231f06b3cb7b4de # v6.0.2
      - uses: actions/setup-node@1f8c5b94ccc75b605ac60e387ee280e8b74667f8 # v4
        with:
          node-version: '20'
      - run: npm install -g bun && cd ./typescript/packages/conft && bun install && bun run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d632683dd7b4114ad1992be3c231f06b3cb7b4de # v6.0.2
      - uses: actions/setup-node@1f8c5b94ccc75b605ac60e387ee280e8b74667f8 # v4
        with:
          node-version: '20'
      - run: npm install -g bun && cd ./typescript/packages/conft && bun install && bun run test && bun run test:coverage

