name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@b1a25efc9b24b1faac6e16951a0a1c3e3b72081f # v4.1.0
        with:
          node-version: '20'
      - run: npm install -g bun
      - working-directory: ./typescript/packages/conft
        run: bun install
      - working-directory: ./typescript/packages/conft
        run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@b1a25efc9b24b1faac6e16951a0a1c3e3b72081f # v4.1.0
        with:
          node-version: '20'
      - run: npm install -g bun
      - working-directory: ./typescript/packages/conft
        run: bun install
      - working-directory: ./typescript/packages/conft
        run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@b1a25efc9b24b1faac6e16951a0a1c3e3b72081f # v4.1.0
        with:
          node-version: '20'
      - run: npm install -g bun
      - working-directory: ./typescript/packages/conft
        run: bun install
      - working-directory: ./typescript/packages/conft
        run: bun run test
      - working-directory: ./typescript/packages/conft
        run: bun run test:coverage

