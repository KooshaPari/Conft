name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trace-gate:
    name: FR Coverage Gate
    uses: KooshaPari/phenotype-pm-core/.github/workflows/trace-gate.yml@main

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./typescript/packages/conft
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@d3603674eff08ce926b5d1ecebf9eee5a00efc81 # v1.2.2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./typescript/packages/conft
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@d3603674eff08ce926b5d1ecebf9eee5a00efc81 # v1.2.2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./typescript/packages/conft
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@d3603674eff08ce926b5d1ecebf9eee5a00efc81 # v1.2.2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test
      - run: bun run test:coverage

