name: SAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

timeout-minutes: 20
permissions:
  contents: read
  security-events: write

jobs:
  sast:
    uses: KooshaPari/phenoShared/.github/workflows/sast-reusable.yml@ac1fef63f31acb3ec550bfdc1f1915075dd1fbb9 # pinned
