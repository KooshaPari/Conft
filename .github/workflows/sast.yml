name: SAST
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

timeout-minutes: 20
permissions:
  contents: read
  security-events: write

jobs:
  sast:
    uses: KooshaPari/phenoShared/.github/workflows/sast-reusable.yml@438e2e71e448c9f1f47f184d3ca4acbb28928677 # pinned
